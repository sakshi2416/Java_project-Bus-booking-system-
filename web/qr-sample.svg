<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- simple QR-like placeholder pattern -->
  <g fill="#111">
    <rect x="30" y="30" width="60" height="60"/>
    <rect x="110" y="30" width="20" height="20"/>
    <rect x="140" y="30" width="20" height="20"/>
    <rect x="30" y="110" width="20" height="20"/>
    <rect x="60" y="110" width="20" height="20"/>
    <rect x="110" y="110" width="40" height="40"/>
    <rect x="180" y="30" width="20" height="20"/>
    <rect x="220" y="30" width="60" height="60"/>
    <rect x="300" y="30" width="20" height="20"/>

    <rect x="30" y="180" width="20" height="20"/>
    <rect x="60" y="180" width="20" height="20"/>
    <rect x="110" y="180" width="20" height="20"/>
    <rect x="140" y="200" width="20" height="20"/>
    <rect x="180" y="140" width="20" height="20"/>
    <rect x="220" y="180" width="20" height="20"/>

    <rect x="260" y="110" width="20" height="20"/>
    <rect x="300" y="110" width="20" height="20"/>
    <rect x="340" y="110" width="20" height="20"/>

    <rect x="200" y="200" width="120" height="20"/>
    <rect x="200" y="230" width="20" height="60"/>
    <rect x="230" y="230" width="20" height="20"/>
    <rect x="260" y="260" width="20" height="20"/>
  </g>
  <text x="50%" y="360" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#333">Scan to Pay</text>
</svg>